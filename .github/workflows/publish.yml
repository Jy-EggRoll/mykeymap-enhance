# 该工作流只能通过正式版本的标签自动触发

name: Publish Release

on:
    push:
        tags:
            - "[0-9]+.[0-9]+.[0-9]+" # 匹配 x.y.z 格式的正式版本标签

permissions:
    contents: write

jobs:
    publish:
        runs-on: windows-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get tag version
              id: get_version
              run: |
                  $VERSION = $env:GITHUB_REF -replace 'refs/tags/', ''
                  echo "version=$VERSION" >> $env:GITHUB_OUTPUT
                  echo "Publishing version: $VERSION"

            - name: Package data directory
              run: |
                  if (Test-Path -Path "data") {
                      Compress-Archive -Path data\* -DestinationPath data.zip
                      Write-Host "Successfully created data.zip"
                  }
              shell: pwsh

            - name: Find previous version tag
              id: previous_tag
              run: |
                  # 获取当前标签
                  CURRENT_TAG="${{ steps.get_version.outputs.version }}"

                  # 获取所有正式版本标签，按版本号排序，找到当前标签之前的最新标签
                  PREVIOUS_TAG=$(git tag -l --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | grep -v "^$CURRENT_TAG$" | head -n1)

                  if [ -n "$PREVIOUS_TAG" ]; then
                    echo "Found previous tag: $PREVIOUS_TAG"
                    echo "previous_tag=$PREVIOUS_TAG" >> $GITHUB_OUTPUT
                  else
                    echo "No previous tag found"
                    echo "previous_tag=" >> $GITHUB_OUTPUT
                  fi
              shell: bash

            - name: Generate release notes
              id: release_notes
              run: |
                  CURRENT_TAG="${{ steps.get_version.outputs.version }}"
                  PREVIOUS_TAG="${{ steps.previous_tag.outputs.previous_tag }}"


                  # 检查是否有 CHANGELOG.md 文件并提取相关版本信息
                  if [ -f "CHANGELOG.md" ]; then
                    echo "## 更新内容" >> release_notes.md
                    
                    # 尝试从 CHANGELOG 中提取当前版本的更新内容
                    awk -v version="$CURRENT_TAG" '
                      /^##/ { 
                        if (found) exit
                        if ($0 ~ version) found=1
                        next
                      }
                      found && /^##/ { exit }
                      found { print }
                    ' CHANGELOG.md >> release_notes.md
                  fi

                  echo "## 提交记录" >> release_notes.md
                  echo "" >> release_notes.md

                  # 生成提交记录（保留开发版本相关的提交）
                  if [ -z "$PREVIOUS_TAG" ]; then
                    echo "生成从初始提交到 $CURRENT_TAG 的提交记录"
                    git log --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
                  else
                    echo "生成从 $PREVIOUS_TAG 到 $CURRENT_TAG 的提交记录"
                    git log "$PREVIOUS_TAG..$CURRENT_TAG" --pretty=format:"- %s (%h)" --no-merges >> release_notes.md
                  fi

                  # 如果没有提交记录，添加默认信息
                  if [ ! -s release_notes.md ] || [ $(wc -l < release_notes.md) -le 5 ]; then
                    echo "- 版本发布" >> release_notes.md
                  fi

                  echo "" >> release_notes.md
                  echo "" >> release_notes.md
                  echo "---" >> release_notes.md
                  echo "" >> release_notes.md
                  echo "📦 **安装说明：**" >> release_notes.md
                  echo "" >> release_notes.md
                  echo "下载压缩包，解压到 mykeymap 目录的对应位置下" >> release_notes.md

                  echo "生成的发布说明："
                  cat release_notes.md
              shell: bash

            - name: Create GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.get_version.outputs.version }}
                  name: "mykeymap-enhance v${{ steps.get_version.outputs.version }}"
                  body_path: release_notes.md
                  files: |
                      data.zip
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload build artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: data-package-${{ steps.get_version.outputs.version }}
                  path: data.zip
                  retention-days: 90
